<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>storyja</title>
  <script>
    // SPA 404 Fallback redirect: Keep pathname and pass it to index.html
    const path = window.location.pathname;
    const search = window.location.search;
    const hash = window.location.hash;
    
    // Redirect back to root while preserving hash route or route path
    if (path === '/pro' || path.startsWith('/pro/')) {
      window.location.replace('/#' + path + search + hash);
    } else {
      window.location.replace('/' + (path.startsWith('/') ? '#' + path : '') + search + hash);
    }
  </script>
</head>
<body style="background:#0B1215;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;">
  <p>Lade Storyja...</p>
</body>
</html>
